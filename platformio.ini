[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
lib_dir = lib
test_dir = tests

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:esp32dev_30fps]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D LTC_FPS=30

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
build_flags =
    -std=gnu++17
